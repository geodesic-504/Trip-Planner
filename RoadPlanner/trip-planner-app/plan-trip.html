<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet" />
  <title>Trip Planner App - Plan a Trip</title>
</head>
<body>

  <div class="app-container">
    
    <header class="app-header">
      <button class="icon-btn hamburger-menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      
      <h1 class="page-title">Plan a Trip</h1>
      
      <img src="./images/v2_944.png" alt="Profile" class="avatar-small" />
    </header>

    <main class="main-content">
      
      <input type="text" class="trip-input" placeholder="Origin" />
      <input type="text" class="trip-input" placeholder="Destination" />
      <input type="number" class="trip-input" placeholder="Number of Stops" />
      
    </main>

    <nav class="bottom-nav">
      <button class="nav-item">
        <span class="material-icons">notifications</span>
      </button>
      
      <button class="nav-item">
        <span class="material-icons">home</span>
      </button>
      
      <button class="nav-item">
        <img src="./images/v2_944.png" alt="Profile" class="avatar-small" />
      </button>
    </nav>

  </div>

</body>
</html>
