<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet" />
  <title>Trip Planner App - Map Route</title>
</head>
<body>

  <div class="app-container">
    
    <header class="app-header">
      <button class="icon-btn hamburger-menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <h1 class="page-title">Map Route</h1>
      <img src="./images/v2_944.png" alt="Profile" class="avatar-small" />
    </header>

    <main class="main-content">
      <img src="./images/map-route.png" alt="Map Route" class="map-graphic" />
      
      <div class="trip-card map-card">
        <h2 class="card-section-title"><u>Stops Added to Route</u></h2>
        <div class="stop-item">
          <span class="material-icons card-icon">keyboard_double_arrow_right</span>
          <span class="added-stop-text">QT Gas Station</span>
        </div>
      </div>

      <div class="trip-card map-card suggestions-card">
        <h2 class="card-section-title"><u>Smart Stops Suggestions</u></h2>
        <div class="suggestion-block">
          <span class="material-icons">add_circle_outline</span>
          <span class="suggestion-text">Buccee’s</span>
        </div>
        <div class="suggestion-block">
          <span class="material-icons">add_circle_outline</span>
          <span class="suggestion-text">Thicket National Preserve</span>
        </div>
      </div>

      <div class="action-button-container">
        <button class="ellipse-btn">Save</button>
        <button class="ellipse-btn">Share</button>
      </div>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item">
        <span class="material-icons">notifications</span>
      </button>
      <button class="nav-item active">
        <span class="material-icons">home</span>
      </button>
      <button class="nav-item">
        <img src="./images/v2_944.png" alt="Profile" class="avatar-small" />
      </button>
    </nav>

  </div>

</body>
</html>
