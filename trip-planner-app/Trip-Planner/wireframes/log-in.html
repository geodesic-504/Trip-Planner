<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600&display=swap" rel="stylesheet" />
  <link href="./css/main.css" rel="stylesheet" />
  <title>Trip Planner App - Login</title>
</head>
<body>

  <div class="login-container">
    
    <img src="./images/v2_79.png" alt="Car Icon" class="app-icon" />

    <h1 class="app-title">Trip Planner App</h1>
    <h2 class="form-title">Log In</h2>
    <p class="form-subtitle">Enter your email and password</p>

    <form class="login-form" action="#">
      <div class="input-group">
        <input type="email" placeholder="email@domain.com" required />
      </div>
      
      <div class="input-group">
        <input type="password" placeholder="password" required />
      </div>

      <button type="submit" class="login-btn">Log In</button>
    </form>

  </div>

</body>
</html>
